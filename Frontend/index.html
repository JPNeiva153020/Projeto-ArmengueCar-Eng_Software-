<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArmengueCar — Gestão de oficina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .integration-note { margin: 12px 0; padding: 12px; border-radius: 8px; background: #eef4ff; }
    .integration-error { color: #a21c24; white-space: pre-wrap; }
    .integration-form { display: grid; gap: 12px; max-width: 650px; }
    .integration-form label { display: grid; gap: 5px; }
    .integration-form input, .integration-form select, .integration-form textarea { width: 100%; padding: 9px; }
    .integration-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .integration-content { padding: 24px; }
    .integration-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 22px; }
    .integration-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .nav-item[aria-current="page"] { background: #242e57; color: #fff; box-shadow: inset 3px 0 var(--royal2); }
    .nav-item[hidden] { display: none; }
    .integration-form input:not([type=checkbox]), .integration-form select, .integration-form textarea { border: 1px solid var(--line); border-radius: 8px; background: white; }
    .integration-table { background: white; border: 1px solid var(--line); border-radius: 12px; }
    .sidebar { overflow-y: auto; }
    .integration-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
    .integration-card { padding: 18px; border: 1px solid #dce3ef; border-radius: 10px; background: white; margin-bottom: 12px; }
    .integration-card h2 { margin-bottom: 8px; }
    .integration-table { overflow-x: auto; }
    .kanban-board { display: grid; grid-template-columns: repeat(8, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 14px; align-items: start; }
    .kanban-column { background: #edf1f7; border-radius: 10px; padding: 10px; min-height: 180px; }
    .kanban-column h3 { font-size: 14px; margin: 3px 0 12px; }
    .kanban-card-real { padding: 12px; border: 1px solid #dce3ef; border-radius: 8px; background: white; margin-bottom: 8px; overflow-wrap: anywhere; }
    .kanban-card-real p { margin: 5px 0; }
    .kanban-filter { margin: 10px 0 16px; max-width: 420px; width: 100%; padding: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e4e9f0; vertical-align: top; }
    button:disabled { opacity: .55; cursor: wait; }
  </style>
</head>
<body>
<div id="login" class="login-screen">
  <div class="login-copy"><div class="login-mark">AC</div><span class="eyebrow">ARMENGUECAR / OFICINA</span><h1>Do check-in à entrega.<br><em>Sem perder o controle.</em></h1><p>Gestão da oficina conectada à API.</p></div>
  <form id="loginForm" class="login-card">
    <div class="brand"><div class="brand-mark">A</div><div><strong>Armengue<span>Car</span></strong><small>gestão de oficina</small></div></div>
    <h2>Acessar sistema</h2>
    <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
    <p id="loginError" class="integration-error" role="alert"></p>
    <button class="btn primary full" type="submit">Entrar</button>
  </form>
</div>
<div id="shell" class="app-shell hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">A</div><div><strong>Armengue<span>Car</span></strong><small>gestão de oficina</small></div></div>
    <div class="role-card"><div class="avatar avatar-blue" id="roleAvatar">AC</div><div><strong id="currentUser"></strong></div></div>
    <nav class="nav" aria-label="Navegação principal">
      <button class="nav-item" data-view="portal" hidden><span>▱</span>Meus veículos</button>
      <button class="nav-item" data-view="dashboard"><span>▦</span>Visão geral</button>
      <button class="nav-item" data-view="kanban"><span>▤</span>Kanban</button>
      <button class="nav-item" data-view="orders"><span>▣</span>Ordens de serviço</button>
      <button class="nav-item" data-view="clients"><span>♙</span>Clientes</button>
      <button class="nav-item" data-view="vehicles"><span>▱</span>Veículos</button>
      <button class="nav-item" data-view="stock"><span>◫</span>Estoque</button>
      <button class="nav-item" data-view="notifications"><span>◌</span>Notificações</button>
      <button class="nav-item" data-view="users"><span>♙</span>Usuários</button>
    </nav>
    <div class="sidebar-bottom"><span class="status-dot">ArmengueCar</span><button class="logout" id="logoutBtn">↪ Sair</button></div>
  </aside>
  <main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button><div class="breadcrumbs"><span>ArmengueCar</span><b>/</b><strong id="pageTitle">Visão geral</strong></div></header>
    <div class="content"><p id="error" class="integration-error" role="alert"></p><section id="app"></section></div>
  </main>
</div>
<script src="js/api-app.js"></script>
</body>
</html>
